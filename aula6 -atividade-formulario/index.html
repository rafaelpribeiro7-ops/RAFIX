<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Usuário</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Cadastro de Usuário</h1>
    
    <!-- Formulário com ID para conexão com o JavaScript -->
    <form id="meuFormulario">
      
      <!-- Nome Completo -->
      <div class="form-group">
        <label for="nome">Nome completo:</label>
        <input type="text" id="nome" name="nome" placeholder="Ex: Ana Silva" required>
      </div>

      <!-- E-mail -->
      <div class="form-group">
        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
      </div>

      <!-- Telefone -->
      <div class="form-group">
        <label for="telefone">Telefone:</label>
        <input type="tel" id="telefone" name="telefone" placeholder="(41) 99999-9999" required>
      </div>

      <!-- Campo de Senha com validação -->
      <div class="form-group">
        <label for="senha">Senha de Acesso:</label>
        <input type="password" id="senha" name="senha" placeholder="Digite a sua senha" required>
        <!-- Local onde a mensagem de erro da senha é exibida -->
        <span id="mensagemErro" class="mensagem-erro"></span>
      </div>

      <!-- Data de Nascimento -->
      <div class="form-group">
        <label for="data">Data de nascimento:</label>
        <input type="date" id="data" name="data" required>
      </div>

      <!-- Gênero -->
      <div class="form-group">
        <label class="label-titulo">Gênero:</label>
        <div class="radio-group">
          <input type="radio" id="masculino" name="sexo" value="masculino">
          <label for="masculino">Masculino</label>

          <input type="radio" id="feminino" name="sexo" value="feminino">
          <label for="feminino">Feminino</label>

          <input type="radio" id="outro" name="sexo" value="outro">
          <label for="outro">Outro</label>
        </div>
      </div>

      <!-- Cidade -->
      <div class="form-group">
        <label for="cidade">Cidade:</label>
        <select id="cidade" name="cidade" required>
          <option value="">Selecione uma cidade</option>
          <option value="curitiba">Curitiba</option>
          <option value="londrina">Londrina</option>
          <option value="maringa">Maringá</option>
          <option value="ponta-grossa">Ponta Grossa</option>
        </select>
      </div>

      <!-- Termos de Uso -->
      <div class="form-group checkbox-group">
        <input type="checkbox" id="termos" name="termos" required>
        <label for="termos">Aceito os termos de uso</label>
      </div>

      <!-- Botão de Envio -->
      <button type="submit">Cadastrar</button>
    </form>
  </div>

  <!-- Importação do arquivo JavaScript -->
  <script src="script.js"></script>
</body>
</html>
